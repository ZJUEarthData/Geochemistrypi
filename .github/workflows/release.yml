name: Signed release candidate

on:
  push:
    tags:
      - "mcp-v*-cli-v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up exact CLI build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Build the CLI wheel on its supported Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0
          python -m build --wheel --outdir release-bundle .

      - name: Set up exact MCP build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the MCP wheel and install release verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0 "./packages/geochemistrypi-mcp[release]"
          python -m build --wheel --outdir release-bundle packages/geochemistrypi-mcp

      - name: Create and inspect the release manifest
        run: |
          geochemistrypi-mcp-release build-manifest --dist release-bundle --release-tag "${GITHUB_REF_NAME}" --source-commit "${GITHUB_SHA}"
          geochemistrypi-mcp-release verify --bundle release-bundle --allow-unsigned

      - name: Sign wheels and manifest with the tag workflow identity
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: |
            release-bundle/*.whl
            release-bundle/release-manifest.json
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false
          upload-signing-artifacts: false

      - name: Verify the signed bundle with the product verifier
        run: geochemistrypi-mcp-release verify --bundle release-bundle

      - name: Attest wheel provenance
        uses: actions/attest@v4
        with:
          subject-path: release-bundle/*.whl

      - name: Attest manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: release-bundle/release-manifest.json

      - name: Retain the signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: geochemistrypi-${{ github.ref_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

      # Deliberately no PyPI, MCP Registry, or GitHub Release publication step.
      # Publication remains a separately authorized gate after all acceptance
      # evidence has passed for this exact signed bundle.

  verify-signed-release:
    name: Signed install (${{ matrix.os }})
    needs: build-sign-attest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The CLI remains Python 3.9-only.  Its legacy scientific stack is
        # currently supported on Intel macOS, so do not imply arm64 support
        # until a native arm64 release candidate passes this same gate.
        os: [ubuntu-latest, windows-latest, macos-15-intel]

    steps:
      - name: Download the exact signed release candidate
        uses: actions/download-artifact@v4
        with:
          name: geochemistrypi-${{ github.ref_name }}
          path: release-bundle

      - name: Set up the public installer runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned bootstrap tool
        run: python -m pip install uv==0.11.7

      - name: Verify and install the downloaded signed bundle as a normal user
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          bundle = Path("release-bundle").resolve()
          files = {path.name for path in bundle.iterdir() if path.is_file()}
          wheels = sorted(bundle.glob("*.whl"))
          signatures = sorted(bundle.glob("*.sigstore.json"))
          if len(wheels) != 2 or len(signatures) != 3 or len(files) != 6:
              raise SystemExit(
                  "Signed bundle must contain exactly two wheels, one manifest, "
                  f"and three Sigstore bundles; found {sorted(files)}"
              )
          if "release-manifest.json" not in files:
              raise SystemExit("Signed bundle is missing release-manifest.json")

          mcp_wheel = next(bundle.glob("geochemistrypi_mcp-*.whl"))
          requirement = f"geochemistrypi-mcp[release] @ {mcp_wheel.as_uri()}"
          isolated = [
              "uv", "run", "--isolated", "--no-project", "--python", "3.11",
              "--with", requirement,
          ]
          environment = os.environ.copy()
          environment["GEOCHEMISTRYPI_MCP_APP_ROOT"] = str(
              Path(os.environ["RUNNER_TEMP"]) / "GeochemistryPi public acceptance 用户数据"
          )
          environment["SQLALCHEMY_DATABASE_URL"] = ""

          def run(*arguments):
              subprocess.check_call([*isolated, *arguments], env=environment)

          run("geochemistrypi-mcp-release", "verify", "--bundle", str(bundle))
          run(
              "geochemistrypi-mcp-setup", "install",
              "--bundle", str(bundle), "--client", "standard",
          )
          run("geochemistrypi-mcp-setup", "install", "--client", "standard")

          app_root = Path(environment["GEOCHEMISTRYPI_MCP_APP_ROOT"])
          run_artifact = app_root / "runs" / "release-user-data" / "result.json"
          tracking_artifact = app_root / "tracking" / "release-user-data" / "meta.yaml"
          run_artifact.parent.mkdir(parents=True, exist_ok=True)
          tracking_artifact.parent.mkdir(parents=True, exist_ok=True)
          run_artifact.write_text('{"preserved": true}\n', encoding="utf-8")
          tracking_artifact.write_text("name: preserved\n", encoding="utf-8")

          run("geochemistrypi-mcp-setup", "repair", "--client", "standard")
          run("geochemistrypi-mcp-doctor", "--json")
          run("geochemistrypi-mcp-setup", "uninstall")

          if run_artifact.read_text(encoding="utf-8") != '{"preserved": true}\n':
              raise SystemExit("Uninstall changed user run data")
          if tracking_artifact.read_text(encoding="utf-8") != "name: preserved\n":
              raise SystemExit("Uninstall changed user tracking data")

name: Signed release candidate

on:
  push:
    tags:
      - "mcp-v*-cli-v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up exact CLI build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Build the CLI wheel on its supported Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0
          python -m build --wheel --outdir release-bundle .

      - name: Set up exact MCP build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the MCP wheel and install release verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0 "./packages/geochemistrypi-mcp[release]"
          python -m build --wheel --outdir release-bundle packages/geochemistrypi-mcp

      - name: Create and inspect the release manifest
        run: |
          geochemistrypi-mcp-release build-manifest --dist release-bundle --release-tag "${GITHUB_REF_NAME}" --source-commit "${GITHUB_SHA}"
          geochemistrypi-mcp-release verify --bundle release-bundle --allow-unsigned

      - name: Sign wheels and manifest with the tag workflow identity
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: |
            release-bundle/*.whl
            release-bundle/release-manifest.json
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false
          upload-signing-artifacts: false

      - name: Verify the signed bundle with the product verifier
        run: geochemistrypi-mcp-release verify --bundle release-bundle

      - name: Attest wheel provenance
        uses: actions/attest@v4
        with:
          subject-path: release-bundle/*.whl

      - name: Attest manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: release-bundle/release-manifest.json

      - name: Retain the signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: geochemistrypi-${{ github.ref_name }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

      # Deliberately no PyPI, MCP Registry, or GitHub Release publication step.
      # Publication remains a separately authorized gate after all acceptance
      # evidence has passed for this exact signed bundle.
